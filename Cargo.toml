[package]
name = "wingbar"
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
description = "A light native macOS status bar: workspaces and script widgets in two wings, managed from the bar"
license = "MIT"
repository = "https://github.com/iammosab/wingbar"
readme = "README.md"
keywords = ["macos", "status-bar", "aerospace", "yabai", "menubar"]
categories = ["gui", "command-line-utilities"]

[dependencies]
block2 = "0.6"
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }
libc = "0.2.191"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFArray",
    "CFDictionary",
    "CFNumber",
    "CFRunLoop",
    "CFString",
] }
objc2-foundation = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
