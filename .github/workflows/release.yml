name: Release

# Push a tag like v0.3.1 (matching Cargo.toml's version) to publish a release:
# a universal (Apple Silicon + Intel) Wingbar.app as wingbar-macos.zip, its
# SHA-256, notes from CHANGELOG.md, and an updated Homebrew formula.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build (universal)
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p out
          lipo -create -output out/wingbar \
            target/aarch64-apple-darwin/release/wingbar \
            target/x86_64-apple-darwin/release/wingbar
          lipo -info out/wingbar

      - name: Bundle
        run: |
          scripts/bundle.sh out/wingbar "$VERSION" out
          codesign --verify --strict out/Wingbar.app
          out/Wingbar.app/Contents/MacOS/wingbar --version
          ditto -c -k --keepParent out/Wingbar.app out/wingbar-macos.zip
          (cd out && shasum -a 256 wingbar-macos.zip > wingbar-macos.zip.sha256)
          cat out/wingbar-macos.zip.sha256
          echo "SHA256=$(cut -d' ' -f1 out/wingbar-macos.zip.sha256)" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > out/notes.md
          cat >> out/notes.md <<EOF

          ## Install

          \`\`\`bash
          brew install iammosab/tap/wingbar && brew services start wingbar
          # or
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | bash
          \`\`\`
          EOF
          gh release create "$GITHUB_REF_NAME" --title "wingbar $VERSION" --notes-file out/notes.md \
            out/wingbar-macos.zip out/wingbar-macos.zip.sha256

      - name: Update the Homebrew formula
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::warning::TAP_DEPLOY_KEY is not set; update iammosab/homebrew-tap by hand"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:iammosab/homebrew-tap.git tap
          cd tap
          sed -i '' \
            -e "s|^  url \".*\"|  url \"https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/wingbar-macos.zip\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"${SHA256}\"|" \
            Formula/wingbar.rb
          git diff
          if git diff --quiet; then echo "formula already at ${VERSION}"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "wingbar ${VERSION}"
          git push
