<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    :root {
      --bg: #0A0B0D;
      --rim: #94B7E8;
      --wing: #FFFFFF;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #FFFFFF;
        --rim: #CBD5E1;
        --wing: #0A0B0D;
      }
    }
    .bg { fill: var(--bg); }
    .rim { stroke: var(--rim); fill: none; stroke-width: 1; }
    .wing { fill: var(--wing); }
  </style>

  <!-- Continuous Squircle Body (scaled to 32x32) -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="6.5" class="bg"/>
  <rect x="1.5" y="1.5" width="29" height="29" rx="6.5" class="rim"/>

  <!-- Left Wing (w9.5, h3.5, r1.5) -->
  <path d="M5.5 11 H15 V13 A1.5 1.5 0 0 1 13.5 14.5 H5.5 Z" class="wing"/>
  <!-- Right Wing (w9.5, h3.5, r1.5) -->
  <path d="M26.5 11 H17 V13 A1.5 1.5 0 0 0 18.5 14.5 H26.5 Z" class="wing"/>
</svg>